name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Install Compact compiler
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf \
          https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Verify Compact installation
      run: compact --version
    
    - name: Create managed directory
      run: mkdir -p contracts/managed
    
    - name: Compile Compact contract
      run: compact compile contracts/counter.compact contracts/managed/counter
      
    - name: Run TypeScript type check
      run: npm run build
      
    - name: Run tests
      run: npm test
      
    - name: Build frontend
      run: npm run build
      
    - name: Check build output
      run: |
        if [ ! -d "dist" ]; then
          echo "Build failed - dist directory not found"
          exit 1
        fi
        echo "Build successful - dist directory created"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: dist/
        retention-days: 7

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint
      continue-on-error: true

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    
    - name: Run security audit
      run: npm audit --audit-level=high
      continue-on-error: true
